[package]
name = "ask-bridge"
version = "0.3.16"
edition = "2024"
build = "build.rs"

[[bin]]
name = "ask-bridge"
path = "src/main.rs"

[[bin]]
name = "ask-bridge-update"
path = "src/update.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
home = "0.5"
mcp-cli = { git = "https://github.com/EngelsChou/mcp-cli", rev = "ce4ae725e0a6ca849ca13be6e513a3e2eae41626" }
gag = "1.0"
base64 = "0.21"

[build-dependencies]
winresource = "0.1.31"
