name: CI

on:
  pull_request:
  push:
    branches: [main, main-add-m365-copilot]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-15
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path windows-installer/Cargo.toml --all -- --check
      - run: cargo test
      - run: npm test

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-15
      - shell: pwsh
        run: |
          ./scripts/build-windows-installers.ps1
          ./scripts/smoke-test-windows-installers.ps1
