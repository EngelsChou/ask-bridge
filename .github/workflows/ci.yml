name: CI

on:
  pull_request:
  push:
    branches: [main, main-add-m365-copilot]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: cargo fmt --all -- --check
      - run: cargo fmt --manifest-path windows-installer/Cargo.toml --all -- --check
      - run: cargo test
      - run: npm test

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - shell: pwsh
        run: |
          ./scripts/build-windows-installers.ps1
          ./scripts/smoke-test-windows-installers.ps1
