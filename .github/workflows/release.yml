name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - name: Verify tag matches Cargo and npm package versions
        shell: pwsh
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_REF_TYPE -ne "tag") {
            throw "Release workflow must run from a vX.Y.Z tag; current ref is '$env:RELEASE_TAG'."
          }
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v(.+)$') {
            throw "Release tag must start with 'v': $tag"
          }
          $expectedVersion = $Matches[1]
          $cargoToml = Get-Content -Raw -Encoding UTF8 Cargo.toml
          $cargoMatch = [regex]::Match($cargoToml, '(?m)^version\s*=\s*"([^"]+)"')
          if (-not $cargoMatch.Success) {
            throw "Could not read the package version from Cargo.toml."
          }
          $cargoVersion = $cargoMatch.Groups[1].Value
          $packageVersion = (Get-Content -Raw -Encoding UTF8 package.json | ConvertFrom-Json).version
          if ($cargoVersion -ne $expectedVersion -or $packageVersion -ne $expectedVersion) {
            throw "Version mismatch: tag=$expectedVersion Cargo.toml=$cargoVersion package.json=$packageVersion"
          }
          Write-Host "Verified release version $expectedVersion."

  build:
    needs: verify-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
            ext: tar.xz
          - target: x86_64-apple-darwin
            os: macos-15-intel
            ext: tar.xz
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: tar.xz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable 2026-07-15
        with:
          targets: ${{ matrix.target }}
      - name: Prepare optional Engels Chou code-signing certificate
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGNING_CERTIFICATE_BASE64)) {
            "ASK_BRIDGE_RELEASE_REQUIRE_SIGNATURE=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "No signing certificate is configured; publishing unsigned Windows executables."
            exit 0
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "engels-chou-code-signing.pfx"
          $base64 = $env:WINDOWS_SIGNING_CERTIFICATE_BASE64 -replace '\s', ''
          $certificateBytes = [Convert]::FromBase64String($base64)
          [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
          $certificate = [Security.Cryptography.X509Certificates.X509Certificate2]::new(
            $certificateBytes,
            $env:WINDOWS_SIGNING_CERTIFICATE_PASSWORD,
            [Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet
          )
          if (-not $certificate.HasPrivateKey) {
            throw "The configured signing certificate has no private key."
          }
          $publisher = $certificate.GetNameInfo(
            [Security.Cryptography.X509Certificates.X509NameType]::SimpleName,
            $false
          )
          if ($publisher -cne "Engels Chou") {
            throw "The signing certificate publisher must be exactly 'Engels Chou'; got '$publisher'."
          }
          $sha256 = [Security.Cryptography.SHA256]::Create()
          try {
            $signerSha256 = ([BitConverter]::ToString($sha256.ComputeHash($certificate.RawData))).Replace('-', '').ToLowerInvariant()
          } finally {
            $sha256.Dispose()
          }
          "ASK_BRIDGE_SIGNING_CERTIFICATE_PATH=$certificatePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ASK_BRIDGE_WINDOWS_SIGNER_SHA256=$signerSha256" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ASK_BRIDGE_RELEASE_REQUIRE_SIGNATURE=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Validated publisher Engels Chou and pinned signer SHA-256 $signerSha256."
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Build offline Windows installers and payloads
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ASK_BRIDGE_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ($env:ASK_BRIDGE_RELEASE_REQUIRE_SIGNATURE -eq "true") {
            ./scripts/build-windows-installers.ps1 -OutputDirectory dist -RequireSignature
          } else {
            ./scripts/build-windows-installers.ps1 -OutputDirectory dist
          }
      - name: Package binary
        shell: pwsh
        run: |
          $binary = "target/${{ matrix.target }}/release/ask-bridge"
          $updateBinary = "target/${{ matrix.target }}/release/ask-bridge-update"
          if ("${{ runner.os }}" -eq "Windows") {
            # build-windows-installers signs the default-target payloads before
            # embedding them; package those exact signed files in the ZIP too.
            $binary = "target/release/ask-bridge.exe"
            $updateBinary = "target/release/ask-bridge-update.exe"
          }
          if (!(Test-Path $binary)) {
            throw "Missing built binary: $binary"
          }
          if (!(Test-Path $updateBinary)) {
            throw "Missing updater binary: $updateBinary"
          }

          New-Item -ItemType Directory -Force dist | Out-Null
          $archive = "dist/ask-bridge-${{ matrix.target }}.${{ matrix.ext }}"
          if ("${{ matrix.ext }}" -eq "zip") {
            function Assert-EngelsChouSignature([string] $path) {
              $signature = Get-AuthenticodeSignature -LiteralPath $path
              if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
                throw "Authenticode verification failed for ${path}: $($signature.Status) $($signature.StatusMessage)"
              }
              $publisher = $signature.SignerCertificate.GetNameInfo(
                [Security.Cryptography.X509Certificates.X509NameType]::SimpleName,
                $false
              )
              if ($publisher -cne "Engels Chou") {
                throw "Unexpected publisher for ${path}: '$publisher'."
              }
              $sha256 = [Security.Cryptography.SHA256]::Create()
              try {
                $actual = ([BitConverter]::ToString($sha256.ComputeHash($signature.SignerCertificate.RawData))).Replace('-', '').ToLowerInvariant()
              } finally {
                $sha256.Dispose()
              }
              if ($actual -cne $env:ASK_BRIDGE_WINDOWS_SIGNER_SHA256) {
                throw "Unexpected signer certificate for $path."
              }
            }
            if ($env:ASK_BRIDGE_RELEASE_REQUIRE_SIGNATURE -eq "true") {
              Assert-EngelsChouSignature $binary
              Assert-EngelsChouSignature $updateBinary
            }
            Compress-Archive -Path $binary, $updateBinary -DestinationPath $archive -Force
            if ($env:ASK_BRIDGE_RELEASE_REQUIRE_SIGNATURE -eq "true") {
              $verifyDirectory = Join-Path $env:RUNNER_TEMP "verify-signed-windows-zip"
              Expand-Archive -LiteralPath $archive -DestinationPath $verifyDirectory -Force
              Assert-EngelsChouSignature (Join-Path $verifyDirectory "ask-bridge.exe")
              Assert-EngelsChouSignature (Join-Path $verifyDirectory "ask-bridge-update.exe")
              Remove-Item -LiteralPath $verifyDirectory -Recurse -Force
            }
          } else {
            $binaryDir = Split-Path $binary
            $binaryLeaf = Split-Path $binary -Leaf
            $updateBinaryLeaf = Split-Path $updateBinary -Leaf
            tar -cJf $archive -C $binaryDir $binaryLeaf $updateBinaryLeaf
          }

          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $(Split-Path $archive -Leaf)" | Out-File "$archive.sha256" -Encoding ascii
      - name: Smoke-test offline Windows installers
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/smoke-test-windows-installers.ps1 -OutputDirectory dist
      - name: Remove temporary signing certificate
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if ($env:ASK_BRIDGE_SIGNING_CERTIFICATE_PATH -and (Test-Path -LiteralPath $env:ASK_BRIDGE_SIGNING_CERTIFICATE_PATH)) {
            Remove-Item -LiteralPath $env:ASK_BRIDGE_SIGNING_CERTIFICATE_PATH -Force
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ask-bridge-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/ask-bridge-${{ matrix.target }}.${{ matrix.ext }}
            dist/ask-bridge-${{ matrix.target }}.${{ matrix.ext }}.sha256
            dist/install.exe
            dist/install.exe.sha256
            dist/uninstall.exe
            dist/uninstall.exe.sha256

  publish-release:
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          expected=(
            ask-bridge-aarch64-apple-darwin.tar.xz
            ask-bridge-aarch64-apple-darwin.tar.xz.sha256
            ask-bridge-x86_64-apple-darwin.tar.xz
            ask-bridge-x86_64-apple-darwin.tar.xz.sha256
            ask-bridge-x86_64-unknown-linux-gnu.tar.xz
            ask-bridge-x86_64-unknown-linux-gnu.tar.xz.sha256
            ask-bridge-x86_64-pc-windows-msvc.zip
            ask-bridge-x86_64-pc-windows-msvc.zip.sha256
            install.exe
            install.exe.sha256
            uninstall.exe
            uninstall.exe.sha256
          )

          mapfile -t actual < <(find artifacts -maxdepth 1 -type f -printf '%f\n' | sort)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${actual[*]}" != "${expected_sorted[*]}" ]]; then
            printf 'Expected release files:\n%s\n' "${expected_sorted[*]}" >&2
            printf 'Actual release files:\n%s\n' "${actual[*]}" >&2
            exit 1
          fi

          for sidecar in artifacts/*.sha256; do
            (
              cd artifacts
              sha256sum --check "$(basename "$sidecar")"
            )
          done

          release_was_published=false
          if gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" == true ]]; then
              gh release upload "$TAG" "${expected[@]/#/artifacts/}" --clobber
            else
              release_was_published=true
              echo "Release $TAG is already published; verify it without mutating public assets."
            fi
          else
            gh release create "$TAG" "${expected[@]/#/artifacts/}" --verify-tag --generate-notes --draft
          fi

          mapfile -t uploaded < <(gh release view "$TAG" --json assets --jq '.assets[].name' | sort)
          if [[ "${uploaded[*]}" != "${expected_sorted[*]}" ]]; then
            printf 'Uploaded release files did not match the expected set.\n' >&2
            exit 1
          fi

          remote_dir="$(mktemp -d)"
          trap 'rm -rf "$remote_dir"' EXIT
          gh release download "$TAG" --dir "$remote_dir" --pattern '*'
          if [[ "$release_was_published" == true ]]; then
            for sidecar in "$remote_dir"/*.sha256; do
              (
                cd "$remote_dir"
                sha256sum --check "$(basename "$sidecar")"
              )
            done
          else
            for file in "${expected[@]}"; do
              if ! cmp --silent "artifacts/$file" "$remote_dir/$file"; then
                echo "Remote release asset differs from the verified build artifact: $file" >&2
                exit 1
              fi
            done
          fi

          if [[ "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" == true ]]; then
            gh release edit "$TAG" --draft=false --latest
          fi
      - name: Dispatch npm publication and require success
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          baseline="$RUNNER_TEMP/npm-run-ids-before.txt"
          gh run list --workflow npm-publish.yml --event workflow_dispatch --limit 100 --json databaseId --jq '.[].databaseId' > "$baseline"
          gh workflow run npm-publish.yml --ref "$TAG"
          run_id=""
          for attempt in $(seq 1 30); do
            while read -r candidate; do
              if ! grep -qx "$candidate" "$baseline"; then
                run_id="$candidate"
                break
              fi
            done < <(gh run list --workflow npm-publish.yml --event workflow_dispatch --limit 20 --json databaseId,headSha --jq ".[] | select(.headSha == \"$HEAD_SHA\") | .databaseId")
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 2
          done
          if [[ -z "$run_id" ]]; then
            echo "Could not find the dispatched npm workflow run for $TAG ($HEAD_SHA)." >&2
            exit 1
          fi
          gh run watch "$run_id" --exit-status
